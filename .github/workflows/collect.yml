name: Сбор постов

on:
  schedule:
    - cron: "17 * * * *"      # каждый час в :17 (GitHub может запускать с опозданием на 5–20 минут)
  workflow_dispatch:           # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write              # сохранить новые посты в data/
  pages: write                 # опубликовать дашборд
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Собрать новые посты
        run: python -m collector

      - name: Сохранить данные в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Новых данных нет"
          else
            git commit -m "Данные: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi

      - name: Собрать дашборд
        run: python -m dashboard

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
