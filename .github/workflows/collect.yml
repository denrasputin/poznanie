name: Сбор постов

on:
  schedule:
    - cron: "17 * * * *"      # запасное расписание: GitHub часто сдвигает и пропускает такие запуски
  workflow_dispatch:           # кнопка «Run workflow»; её же раз в час нажимает внешний «будильник» (docs/external-trigger.md)

permissions:
  contents: write              # сохранить новые посты в ветку data

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4          # код и sources.yaml — из main

      - uses: actions/checkout@v4          # данные — из отдельной ветки data, в папку data/
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Собрать новые посты
        run: python -m collector

      - name: Обновить значки сайтов
        continue-on-error: true            # без новых значков сайт всё равно соберётся
        run: python -m dashboard.favicons

      - name: Сохранить данные в ветку data
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Новых данных нет"
            exit 0
          fi
          git commit -q -m "Данные: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1

# Публикацию сайта после сбора делает отдельный сценарий deploy.yml («Публикация сайта»).
